<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Loan Approval Risk Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <div class="card shadow-lg">

                <div class="card-header bg-primary text-white">

                    <h2 class="mb-1">
                        AI-Powered Loan Approval Risk Prediction System
                    </h2>

                    <p class="mb-0">
                        Financial Risk Modeling & Intelligence
                    </p>

                </div>

                <div class="card-body">

                    <form id="loanForm">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Loan ID
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="loan_id"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Gender
                                </label>

                                <select
                                    class="form-select"
                                    id="gender"
                                    required>

                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>

                                </select>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Married
                                </label>

                                <select
                                    class="form-select"
                                    id="married">

                                    <option value="Yes">Yes</option>
                                    <option value="No">No</option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Dependents
                                </label>

                                <select
                                    class="form-select"
                                    id="dependents">

                                    <option>0</option>
                                    <option>1</option>
                                    <option>2</option>
                                    <option>3+</option>

                                </select>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Education
                                </label>

                                <select
                                    class="form-select"
                                    id="education">

                                    <option value="Graduate">
                                        Graduate
                                    </option>

                                    <option value="Not Graduate">
                                        Not Graduate
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Self Employed
                                </label>

                                <select
                                    class="form-select"
                                    id="self_employed">

                                    <option value="No">No</option>
                                    <option value="Yes">Yes</option>

                                </select>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Applicant Income
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="applicant_income"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Coapplicant Income
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="coapplicant_income"
                                    required>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Loan Amount
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="loan_amount"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Loan Amount Term
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="loan_amount_term"
                                    value="360"
                                    required>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Credit History
                                </label>

                                <select
                                    class="form-select"
                                    id="credit_history">

                                    <option value="1">
                                        Good
                                    </option>

                                    <option value="0">
                                        Poor
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Property Area
                                </label>

                                <select
                                    class="form-select"
                                    id="property_area">

                                    <option>Urban</option>
                                    <option>Semiurban</option>
                                    <option>Rural</option>

                                </select>

                            </div>

                        </div>

                        <div class="text-center mt-4">

                            <button
                                class="btn btn-primary btn-lg"
                                type="submit">

                                Predict Loan Approval

                            </button>

                        </div>

                    </form>

                    <div
                        id="loading"
                        class="text-center mt-4"
                        style="display:none;">

                        <div
                            class="spinner-border text-primary">
                        </div>

                        <p class="mt-3">
                            Predicting...
                        </p>

                    </div>

                    <div
                        id="result"
                        class="mt-5"
                        style="display:none;">

                        <div class="card border-success">

                            <div class="card-body">

                                <h3>
                                    Prediction Result
                                </h3>

                                <hr>

                                <p>
                                    <strong>Loan ID:</strong>
                                    <span id="loanResult"></span>
                                </p>

                                <p>
                                    <strong>Status:</strong>
                                    <span id="statusResult"></span>
                                </p>

                                <p>
                                    <strong>Default Risk Probability:</strong>
                                    <span id="probabilityResult"></span>
                                </p>

                                <p>
                                    <strong>Confidence:</strong>
                                    <span id="confidenceResult"></span>
                                </p>

                            </div>

                        </div>

                    </div>

                    <div
                        id="errorBox"
                        class="alert alert-danger mt-4"
                        style="display:none;">
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
